version: '3.8'

services:
  db:
    image: postgres:15
    container_name: investment_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root1234!
      POSTGRES_DB: investment_diary
    ports:
      - "5432:5432"
    volumes:
      # 로컬에 데이터를 저장하여 데이터 유실 방지
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: